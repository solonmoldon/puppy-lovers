<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppy Lovers Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER: Contains the main title -->
    <header class="blueBG myheader">
        <h1>Puppy Lovers Page</h1>
    </header>

    <!-- BANNER: Large main image at the top -->
    <section id="banner">
        <img class="bannerimage" src="images/banner-puppies.jpg" alt="A cute puppies">
    </section>

    <!-- MISSING PUPPY SECTION: Three items in a row -->
    <section class="puppiessection">
        <div class="puppyitem">
            <img  src="images/puppy-1.jpg" alt="A young cute puppy">
        </div>
        <div class="missingpuppy">
            <p class="missingalert">Puppy missing here!!</p>
        </div>
        <div class="puppyitem">
            <img  src="images/puppy-2.jpg" alt="A young cute puppy">
        </div>
    </section>

    <!-- MORE PUPPIES: Grid of two images -->
    <section class="moresection">
        <h2 class="sectiontitle">More Puppies</h2>
        <div class="puppygrid">
            <div class="puppycard">
                <img " src="images/puppy-3.jpg" alt="A cute puppy with a girl">
            </div>
            <div class="puppycard">
                <img " src="images/puppy-4.jpg" alt="A cute puppy">
            </div>
        </div>
    </section>

    <!-- FOOTER: Credits -->
    <footer class="blueBG">
        <p class="footertext">Developed by : <a class="githublink" href="https://github.com/solonmoldon" target="_blank">Solomon Mehiret</a></p>
    </footer>

</body>
</html>
